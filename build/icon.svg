<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#e08a52"/>
      <stop offset="0.55" stop-color="#c25f2c"/>
      <stop offset="1" stop-color="#9c4520"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe07a"/>
      <stop offset="1" stop-color="#f6c33f"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#5b2409" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- macOS-style rounded square -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="none"
        stroke="#ffffff" stroke-opacity="0.16" stroke-width="4"/>

  <!-- Lines of text; the middle one carries the reading marker. -->
  <g fill="#ffffff" fill-opacity="0.92">
    <rect x="212" y="300" width="428" height="42" rx="21"/>
    <rect x="212" y="378" width="506" height="42" rx="21"/>
  </g>

  <!-- The highlighted line being spoken right now. -->
  <g filter="url(#soft)">
    <rect x="186" y="466" width="510" height="92" rx="30" fill="url(#mark)"/>
  </g>
  <g fill="#7a3a12" fill-opacity="0.82">
    <rect x="216" y="494" width="180" height="36" rx="18"/>
    <rect x="418" y="494" width="104" height="36" rx="18"/>
    <rect x="544" y="494" width="122" height="36" rx="18"/>
  </g>

  <g fill="#ffffff" fill-opacity="0.92">
    <rect x="212" y="606" width="476" height="42" rx="21"/>
    <rect x="212" y="684" width="344" height="42" rx="21"/>
  </g>

  <!-- Sound coming off the marked line. -->
  <g fill="none" stroke="#ffe9b8" stroke-linecap="round" stroke-width="30">
    <path d="M748 466 a 78 78 0 0 1 0 92" stroke-opacity="0.95"/>
    <path d="M818 428 a 140 140 0 0 1 0 168" stroke-opacity="0.66"/>
    <path d="M888 390 a 202 202 0 0 1 0 244" stroke-opacity="0.36"/>
  </g>
</svg>
